art">Pricing, approvals,</text><text x="549" y="321" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">policy dates (Python)</text><rect x="295" y="370" width="230" height="95" rx="10" fill="#ffffff" stroke="#e8b86a" stroke-width="1.5"/><text x="309" y="394" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">PII masking</text><text x="309" y="414" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">Cards never leave</text><text x="309" y="431" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">the data store</text><rect x="535" y="370" width="230" height="95" rx="10" fill="#ffffff" stroke="#e8b86a" stroke-width="1.5"/><text x="549" y="394" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Guardrails</text><text x="549" y="414" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">Rate limits, token budget,</text><text x="549" y="431" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">history cap, lockouts</text><rect x="295" y="480" width="230" height="100" rx="10" fill="#ffffff" stroke="#e8b86a" stroke-width="1.5"/><text x="309" y="504" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Sample data</text><text x="309" y="524" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">CSV + policy .md</text><text x="309" y="541" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">in the image,</text><text x="309" y="558" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">validated at start</text><rect x="535" y="480" width="230" height="100" rx="10" fill="#ffffff" stroke="#e8b86a" stroke-width="1.5"/><text x="549" y="504" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Runtime logs</text><text x="549" y="524" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">Tickets, traces, audit</text><text x="549" y="541" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">(JSONL, reset on</text><text x="549" y="558" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">restart)</text><rect x="295" y="595" width="470" height="95" rx="10" fill="#ffffff" stroke="#e8b86a" stroke-width="1.5"/><text x="309" y="619" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Scale rules</text><text x="309" y="639" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">Scale to zero when idle; one replica (sessions in memory)</text><text x="309" y="656" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">Cron warm windows 6am–6pm ET for demo season</text><rect x="810" y="150" width="270" height="85" rx="10" fill="#ffffff" stroke="#9fb3d6" stroke-width="1.5"/><text x="824" y="174" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Key Vault</text><text x="824" y="194" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">anthropic-api-key</text><text x="824" y="211" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">read by managed identity</text><rect x="810" y="255" width="270" height="85" rx="10" fill="#ffffff" stroke="#9fb3d6" stroke-width="1.5"/><text x="824" y="279" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Managed identity</text><text x="824" y="299" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">Pulls image, reads secret,</text><text x="824" y="316" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">writes settings; no keys in code</text><rect x="810" y="360" width="270" height="85" rx="10" fill="#ffffff" stroke="#9fb3d6" stroke-width="1.5"/><text x="824" y="384" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Container Registry</text><text x="824" y="404" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">solstice-web image</text><text x="824" y="421" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">built in Azure (az acr build)</text><rect x="810" y="465" width="270" height="110" rx="10" fill="#ffffff" stroke="#9fb3d6" stroke-width="1.5"/><text x="824" y="489" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Log Analytics</text><text x="824" y="509" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">Container logs, probes,</text><text x="824" y="526" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">/healthz liveness; App</text><text x="824" y="543" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">Insights ready (next step)</text><rect x="810" y="590" width="270" height="100" rx="10" fill="#ffffff" stroke="#9fb3d6" stroke-width="1.5"/><text x="824" y="614" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Blob Storage</text><text x="824" y="634" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">Admin settings: theme,</text><text x="824" y="651" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">demo open access</text><text x="824" y="668" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">Managed identity, no keys</text><rect x="1130" y="100" width="280" height="630" rx="14" fill="#f3eefb" stroke="#b39ddb" stroke-width="1.5"/><text x="1146" y="126" font-size="12" font-weight="700" fill="#5d6475" text-anchor="start">OUTSIDE AZURE</text><rect x="1145" y="150" width="250" height="115" rx="10" fill="#ffffff" stroke="#b39ddb" stroke-width="1.5"/><text x="1159" y="174" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Anthropic API</text><text x="1159" y="194" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">Claude Haiku 5.5</text><text x="1159" y="211" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">Demo workspace with a</text><text x="1159" y="228" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="sta