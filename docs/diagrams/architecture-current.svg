<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="835" viewBox="0 0 1440 835" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14213d"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs><rect width="1440" height="835" fill="#ffffff"/><rect width="1440" height="6" fill="#f2a541"/><text x="30" y="46" font-size="24" font-weight="700" fill="#14213d">Solstice AI Concierge &amp; Group Sales · Demo as deployed</text><text x="30" y="72" font-size="14" fill="#5d6475">Running today on Azure Container Apps; every box below exists and can be opened in the Azure portal</text><rect x="30" y="100" width="200" height="630" rx="14" fill="#f6f4ef" stroke="#c9c3b4" stroke-width="1.5"/><text x="46" y="126" font-size="12" font-weight="700" fill="#5d6475" text-anchor="start">USERS</text><rect x="45" y="150" width="170" height="90" rx="10" fill="#ffffff" stroke="#c9c3b4" stroke-width="1.5"/><text x="59" y="174" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Guest</text><text x="59" y="194" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">Browser</text><text x="59" y="211" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">/  (no login)</text><rect x="45" y="270" width="170" height="90" rx="10" fill="#ffffff" stroke="#c9c3b4" stroke-width="1.5"/><text x="59" y="294" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Staff</text><text x="59" y="314" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">/staff</text><text x="59" y="331" font-size="12.5" font-weight="400" fill="#5d6475" text-anchor="start">demo PIN</text><rect x="45" y="390" width="170" height="90" rx="10" fill="#ff