<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solstice Admin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="sun" aria-hidden="true"></div>Solstice Hotels <small>Admin</small></div>
    <div class="actions hidden" id="topActions">
      <button class="btn ghost" id="refresh" type="button">Refresh</button>
      <button class="btn ghost" id="signOut" type="button">Sign out</button>
    </div>
  </header>

  <section class="center" id="loginView">
    <form class="card login" id="loginForm">
      <h2>Admin sign in</h2>
      <p>Agent settings, health checks, activity and data quality. Read-only, except the website theme and demo access.</p>
      <div class="field">
        <label for="pin">Admin PIN</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="off" required>
      </div>
      <div class="error" id="loginError" role="alert"></div>
      <button class="btn primary" type="submit" style="width:100%">Sign in</button>
      <div class="demo-note">Demo gate only. In production, admins sign in with company SSO and MFA.</div>
    </form>
  </section>

  <main class="admin-main hidden" id="adminView">
    <div class="panel">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="health" type="button">Health</button>
        <button class="tab" data-tab="activity" type="button">Activity</button>
        <button class="tab" data-tab="settings" type="button">Settings</button>
        <button class="tab" data-tab="tools" type="button">Tools</button>
        <button class="tab" data-tab="dq" type="button">Data quality</button>
        <button class="tab" data-tab="appearance" type="button">Appearance</button>
        <button class="tab" data-tab="access" type="button">Access</button>
      </div>
      <div class="panel-body" id="body"></div>
    </div>
  </main>

  <script src="/static/common.js"></script>
  <script>
    Solstice.demo.init("Admin view", "admin");
    const $ = id => document.getElementById(id);
    Solstice.relaxPin($("pin"));
    const esc = Solstice.escapeHtml;
    let token = null;
    let tab = "health";

    $("loginForm").addEventListener("submit", async e => {
      e.preventDefault();
      $("loginError").textContent = "";
      try {
        const r = await Solstice.api("/api/sessions", { method: "POST", body: { view: "admin", pin: $("pin").value } });
        token = r.token; $("pin").value = "";
        $("loginView").classList.add("hidden");
        $("adminView").classList.remove("hidden");
        $("topActions").classList.remove("hidden");
        show(tab);
      } catch (err) { $("loginError").textContent = err.message; }
    });

    function signOut(msg) {
      if (token) Solstice.api("/api/sessions", { method: "DELETE", token }).catch(() => {});
      token = null;
      $("adminView").classList.add("hidden");
      $("topActions").classList.add("hidden");
      $("loginView").classList.remove("hidden");
      $("loginError").textContent = msg || "";
    }
    $("signOut").addEventListener("click", () => signOut(""));
    $("refresh").addEventListener("click", () => show(tab));

    document.querySelector(".tabs").addEventListener("click", e => {
      const t = e.target.closest(".tab");
      if (!t) return;
      document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
      show(t.dataset.tab);
    });

    const pill = s => `<span class="pill ${({ OK: "ok", WARN: "warn", FAIL: "fail" })[s] || "info"}">${esc(s)}</span>`;
    const get = path => Solstice.api(path, { token });

    async function show(name, opts = {}) {
      tab = name;
      if (name !== "appearance" && savedTheme) document.documentElement.dataset.theme = savedTheme;   // drop an unsaved preview
      const body = $("body");
      body.innerHTML = '<div class="empty">Loading…</div>';
      try {
        body.innerHTML = await RENDER[name](opts);
        if (name === "health") $("checkApi").addEventListener("click", () => show("health", { api: true }));
        if (name === "appearance") bindAppearance();
        if (name === "access") bindAccess();
      } catch (e) {
        if (e.status === 401) return signOut("Session expired. Please sign in again.");
        body.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
      }
    }

    // Appearance: the one place the admin console writes. Click a card to preview it on this page,
    // then Save to make it the site-wide theme for guests and staff.
    let savedTheme = null;
    function bindAppearance() {
      const save = $("saveTheme"), msg = $("themeMsg");
      const picked = () => document.querySelector(".theme-card.active").dataset.id;
      document.querySelector(".theme-grid").addEventListener("click", e => {
        const c = e.target.closest(".theme-card");
        if (!c) return;
        document.querySelectorAll(".theme-card").forEach(x => {
          x.classList.toggle("active", x === c);
          x.setAttribute("aria-checked", x === c);
        });
        document.documentElement.dataset.theme = c.dataset.id;   // live preview, not saved yet
        save.disabled = c.dataset.id === savedTheme;
        msg.textContent = save.disabled ? "" : "Previewing. Not saved yet.";
      });
      save.addEventListener("click", async () => {
        save.disabled = true; msg.textContent = "Saving…";
        try {
          const r = await Solstice.api("/api/admin/theme", { method: "PUT", body: { theme: picked() }, token });
          savedTheme = r.current;
          msg.textContent = "Saved. Every page now uses this theme.";
        } catch (err) {
          if (err.status === 401) return signOut("Session expired. Please sign in again.");
          save.disabled = false; msg.textContent = err.message;
        }
      });
    }

    // Access: demo open access (blank-PIN sign-in for staff and admin). Takes effect at once for everyone.
    function bindAccess() {
      const btn = $("toggleOpen"), msg = $("openMsg");
      if (!btn) return;
      btn.addEventListener("click", async () => {
        btn.disabled = true; msg.textContent = "Saving…";
        try {
          const o = await Solstice.api("/api/admin/open-access", { method: "PUT", body: { enabled: btn.dataset.next === "on" }, token });
          Solstice.demo.refresh(o.enabled);   // demo banner and view switcher follow the switch right away
          show("access");
        } catch (err) {
          if (err.status === 401) return signOut("Session expired. Please sign in again.");
          btn.disabled = false; msg.textContent = err.message;
        }
      });
    }

    const RENDER = {
      async access() {
        const o = await get("/api/admin/open-access");
        const stored = o.store === "azure-blob" ? "Azure Blob Storage, so it survives restarts" : "a local file (data/runtime/open_access.json)";
        if (!o.allowed) return `<p class="hint">Demo open access is switched off for this deployment (<span class="mono">access.allow_open_access: false</span> in config/settings.yaml). Staff and admin always need their PIN here.</p>`;
        return `<p class="hint">Demo open access lets anyone sign in to the staff console and this admin console with the PIN field left empty. It applies to everyone at once and takes effect immediately, with no deploy. Saved to ${stored}.</p>
          <div class="kpis"><div class="kpi"><div class="label">Blank-PIN sign-in</div>
            <div class="value">${o.enabled ? "ON" : "Off"}</div>
            <div class="note">${o.enabled ? "Anyone with the site address can get in. Turn off after the demo." : "PINs are required."}</div></div></div>
          <p><button class="btn ${o.enabled ? "" : "primary"}" id="toggleOpen" data-next="${o.enabled ? "off" : "on"}" type="button">${o.enabled ? "Turn off, require PINs" : "Turn on for a demo"}</button>
            <span class="hint" id="openMsg" role="status" style="margin-left:8px"></span></p>
          <p class="hint">Turning it off doesn't sign out anyone already in.</p>`;
      },

      async appearance() {
        const t = await get("/api/admin/theme");
        savedTheme = t.current;
        document.documentElement.dataset.theme = t.current;
        const sw = list => list.map(c => `<i style="background:${esc(c)}"></i>`).join("");
        return `<p class="hint">The look of the guest, staff and admin pages. Click a theme to preview it here, then save to apply it to everyone.
            Saved to ${t.store === "azure-blob" ? "Azure Blob Storage, so it survives restarts and redeploys" : "a local file (data/runtime/theme.json); Azure deployments use Blob Storage"}.</p>
          <div class="theme-grid" role="radiogroup" aria-label="Website theme">
            ${t.themes.map(x => `<button type="button" role="radio" class="theme-card${x.id === t.current ? " active" : ""}" aria-checked="${x.id === t.current}" data-id="${esc(x.id)}">
              <span class="swatch">${sw(x.swatch)}</span>
              <strong>${esc(x.label)}${x.id === t.default ? ' <span class="pill info">default</span>' : ""}</strong>
              <span>${esc(x.description)}</span></button>`).join("")}
          </div>
          <p><button class="btn primary" id="saveTheme" type="button" disabled>Save theme</button>
            <span class="hint" id="themeMsg" role="status" style="margin-left:8px"></span></p>`;
      },

      async health({ api }) {
        const rows = await get(`/api/admin/health${api ? "?api=true" : ""}`);
        return `<p class="hint">${api ? "Includes a live API check (looks up each configured model; uses no tokens)." :
                  "Local checks only."} <button class="btn" id="checkApi" type="button">Check API connection</button></p>
          <table><thead><tr><th>Status</th><th>Check</th><th>Detail</th></tr></thead><tbody>
          ${rows.map(r => `<tr><td>${pill(r.status)}</td><td>${esc(r.check)}</td><td>${esc(r.detail)}</td></tr>`).join("")}
          </tbody></table>`;
      },

      async activity() {
        const a = await get("/api/admin/activity");
        const kpi = (label, value, note = "") => `<div class="kpi"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="note">${esc(note)}</div></div>`;
        const byMode = Object.entries(a.by_agent_mode).map(([k, v]) => `${k}: ${v}`).join(", ") || "none yet";
        const pinFails = Object.entries(a.pin_failures).map(([k, v]) => `${k}: ${v}`).join(", ") || "0";
        const hits = Object.entries(a.limit_hits).map(([k, v]) => `${k.replace(/_/g, " ")}: ${v}`).join(", ");
        const hitTotal = Object.values(a.limit_hits).reduce((x, y) => x + y, 0);
        const lim = a.limits;
        return `<p class="hint">From the runtime logs in data/runtime/. Production reads these from Application Insights.</p>
          <div class="kpis">
            ${kpi("Conversation turns", a.turns, byMode)}
            ${kpi("Chat latency avg / p95", `${a.avg_latency_s}s / ${a.p95_latency_s}s`, `guests & front desk · target ${a.latency_target_s}s · ${a.within_target_pct}% within`)}
            ${kpi("Group sales p95", `${a.group_p95_latency_s}s`, `${a.group_turns} turns · target ${a.group_latency_target_s}s · ${a.group_within_target_pct}% within`)}
            ${kpi("Tokens in / out", `${a.tokens_in.toLocaleString()} / ${a.tokens_out.toLocaleString()}`)}
            ${kpi("Tool calls", a.tool_calls, `${a.tool_errors} errors`)}
            ${kpi("Escalations to staff", a.escalations)}
            ${kpi("Service requests", a.service_requests)}
            ${kpi("Group proposals", a.proposals)}
            ${kpi("Failed verifications", a.failed_verifications)}
            ${kpi("Failed PIN attempts", pinFails)}
          </div>
          <h3 class="section-title">Cost and abuse guardrails <span style="font-weight:400;color:var(--muted)">(limits in config/settings.yaml)</span></h3>
          <div class="kpis">
            ${kpi("Tokens today (UTC)", lim.tokens_today.toLocaleString(), `${lim.budget_used_pct}% of ${lim.daily_token_budget.toLocaleString()} daily budget`)}
            ${kpi("Limit hits", hitTotal, hits || "none")}
            ${kpi("Model unavailable", a.model_unavailable, "handed to staff automatically")}
          </div>`;
      },

      async settings() {
        const s = await get("/api/admin/settings");
        const row = (k, v, note = "") => `<tr><td>${esc(k)}</td><td class="mono">${esc(v)}</td><td style="color:var(--muted)">${esc(note)}</td></tr>`;
        const g = s.group_rules;
        return `<p class="hint">Read-only. To change a value, edit ${s.edit_files.map(f => `<span class="mono">${esc(f)}</span>`).join(", ")} and save: settings and group rules apply to the next request, prompts to the next new conversation.</p>
          <h3 class="section-title">Agent</h3>
          <table><tbody>
            ${Object.entries(s.models).map(([a, m]) => row(`Model (${a})`, m.model, m.source)).join("")}
            ${row("Max tokens per reply", s.max_tokens)}
            ${row("Max tool rounds per turn", s.max_tool_rounds)}
            ${row("Demo date", s.demo_today, s.demo_today_pinned ? "pinned" : "real date")}
            ${row("Latency target (p95), chat", `${s.latency_target_s}s`, "guests and front desk")}
            ${row("Latency target (p95), group sales", `${s.group_latency_target_s}s`, "back-office work")}
          </tbody></table>
          <h3 class="section-title">Access</h3>
          <table><tbody>
            ${row("Demo open access", s.access.open_access.enabled ? "ON: blank PIN accepted" : (s.access.open_access.allowed ? "off" : "disabled"), "switch in the Access tab; master switch access.allow_open_access")}
            ${row("Staff PIN", "set", s.access.staff_pin)}
            ${row("Admin PIN", "set", s.access.admin_pin)}
            ${row("Guest verification lockout", `after ${s.access.max_failed_verifications} failed attempts per chat`)}
          </tbody></table>
          <h3 class="section-title">Group rules</h3>
          <table><tbody>
            ${Object.entries(g.global).map(([k, v]) => row(k, v)).join("")}
            ${g.seasonal_caps.map(c => row(`Seasonal cap ${c.property}`, `${c.cap_pct}%`, `months ${c.months.join(", ")}`)).join("")}
            ${g.property_rules.map(r => row(`Property rule ${r.property}`, r.type)).join("")}
          </tbody></table>`;
      },

      async tools() {
        const t = await get("/api/admin/tools");
        return Object.entries(t).map(([k, list]) => `
          <h3 class="section-title">${esc(k)} <span class="pill info">${list.length} tools</span></h3>
          <table><tbody>${list.map(x => `<tr><td class="mono">${esc(x.name)}</td><td>${esc(x.description)}</td></tr>`).join("")}</tbody></table>`).join("");
      },

      async dq() {
        const list = await get("/api/admin/data-quality");
        const sev = { error: "fail", warning: "warn", info: "info" };
        return `<p class="hint">Problems found in the source CSVs at load time, and how the agent handles each one.</p>
          <table><thead><tr><th>Severity</th><th>Record</th><th>Field</th><th>Problem</th><th>Agent handling</th></tr></thead><tbody>
          ${list.map(i => `<tr><td><span class="pill ${sev[i.severity]}">${esc(i.severity)}</span></td><td class="mono">${esc(i.record_id)}</td>
            <td class="mono">${esc(i.field)}</td><td>${esc(i.problem)}</td><td>${esc(i.agent_handling)}</td></tr>`).join("")}
          </tbody></table>`;
      },
    };

    $("pin").focus();
  </script>
</body>
</html>
