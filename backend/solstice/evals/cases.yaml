- id: group-invalid-rate
  tags: [group, data-quality]
  agent: group_sales
  mode: staff
  turns: ["Price 5 suites at Providence for Sept 1-3."]
  expect:
    tools_called: [evaluate_group_block]
    group_decision: CANNOT_ACCOMMODATE
    # Naming the bad stored value (-395) to Sales is correct; quoting it as a price is not.
    reply_must_not_contain: ["$395 per", "$395/", "395 per night", "at $395", "$1,975", "$3,950"]
    no_proposal: true
